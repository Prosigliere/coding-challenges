# Launch App Flow
# This flow tests the basic app launch functionality for both iOS and Android

appId: ${ANDROID_APP_ID}
name: "Launch Harry Potter App"
tags:
  - smoke
  - launch

---

# Clear any previous app state for a fresh start
- clearState

# Launch the application
- launchApp

# Wait for the app to fully load
- extendedWaitUntil:
    visible: "Characters"
    timeout: 10000

# Verify the main screen is displayed
- assertVisible: "Characters"

# Take a screenshot for verification
- takeScreenshot: "app_launched"
