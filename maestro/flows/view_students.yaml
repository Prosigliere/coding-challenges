# View Students Flow
# Tests the students filter functionality

appId: ${ANDROID_APP_ID}
name: "View Students Only"
tags:
  - characters
  - filter

---

# Launch the app
- launchApp

# Wait for the app to load
- extendedWaitUntil:
    visible: "Characters"
    timeout: 10000

# Tap on "Students" tab/filter
- tapOn:
    text: "Students"

# Wait for the filtered list to load
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# Verify we're viewing students (Harry Potter should be visible as a student)
- assertVisible:
    text: "Harry Potter"
    optional: true

# Scroll through the students list
- scroll:
    direction: DOWN

# Take a screenshot of the students view
- takeScreenshot: "students_view"

# Verify the filter is active
- assertVisible:
    text: "Students"
